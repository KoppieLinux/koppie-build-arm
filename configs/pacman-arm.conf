#
# /etc/pacman.conf for Arch Linux ARM (aarch64) with Koppie Local Repo
#

[options]
HoldPkg     = pacman glibc
Architecture = aarch64
ParallelDownloads = 5
SigLevel    = Never
LocalFileSigLevel = Optional

[koppie]
SigLevel = Optional TrustAll
Server = https://raw.githubusercontent.com/KoppieLinux/koppie-repo/master/aarch64

[core]
Server = http://mirror.archlinuxarm.org/aarch64/$repo

[extra]
Server = http://mirror.archlinuxarm.org/aarch64/$repo

[alarm]
Server = http://mirror.archlinuxarm.org/aarch64/$repo

[aur]
Server = http://mirror.archlinuxarm.org/aarch64/$repo
