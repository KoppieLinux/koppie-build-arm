---
# shellprocess: beresin target habis unpack (jalan di DALAM chroot target).
# 1-3: kernel/initramfs/GRUB (sistem bisa boot & multi-boot os-prober).
# 4-8: BUNUH sisa live (service live-user, autologin, /home/live, icon installer, pacman sync).
dontChroot: false
timeout: 1800
script:
    - command: rm -f /etc/mkinitcpio.conf.d/archiso.conf
      timeout: 30
    - command: /bin/sh -c 'if [ ! -r /boot/vmlinuz-linux-lts ]; then rm -f /boot/vmlinuz-linux-lts; cp -f /lib/modules/*/vmlinuz /boot/vmlinuz-linux-lts; fi'
      timeout: 60
    - command: mkinitcpio -P
      timeout: 900
    # Pastikan GRUB_DISABLE_OS_PROBER=false ada di /etc/default/grub target
    - command: /bin/sh -c 'if [ -f /etc/default/grub ]; then sed -i "s|^#*GRUB_DISABLE_OS_PROBER=.*|GRUB_DISABLE_OS_PROBER=false|" /etc/default/grub; if ! grep -q "^GRUB_DISABLE_OS_PROBER=" /etc/default/grub; then echo "GRUB_DISABLE_OS_PROBER=false" >> /etc/default/grub; fi; fi'
      timeout: 30
    - command: grub-mkconfig -o /boot/grub/grub.cfg
      timeout: 600
    - command: /bin/sh -c 'if [ -d /usr/share/koppie/pacman-sync ]; then mkdir -p /var/lib/pacman/sync && cp -a /usr/share/koppie/pacman-sync/*.db /var/lib/pacman/sync/ 2>/dev/null || true; fi'
      timeout: 60
    - command: systemctl disable koppie-live-user.service
      timeout: 30
    - command: rm -f /etc/systemd/system/multi-user.target.wants/koppie-live-user.service
      timeout: 30
    - command: sed -i /^User=live$/d /etc/sddm.conf.d/koppie.conf
      timeout: 30
    - command: rm -rf /home/live
      timeout: 30
    - command: rm -f /etc/skel/Desktop/calamares.desktop
      timeout: 30
    - command: /bin/sh -c 'if ! grep -q "^\[koppie\]" /etc/pacman.conf; then printf "\n# Koppie Linux - Official Online Repository\n[koppie]\nSigLevel = Optional TrustAll\nServer = https://github.com/maularaihan-git/koppie-repo/releases/download/koppie-v1\nServer = https://raw.githubusercontent.com/maularaihan-git/koppie-repo/main/aarch64\n" >> /etc/pacman.conf; fi'
      timeout: 30
